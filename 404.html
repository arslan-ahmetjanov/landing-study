<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — учебный макет лендинга</title>
<meta name="theme-color" content="#0b5c8a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b5c8a'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M7 18a13 13 0 0 1 18 0'/%3E%3Cpath d='M11 22.5a7.5 7.5 0 0 1 10 0'/%3E%3C/g%3E%3Ccircle cx='16' cy='26' r='1.9' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { --ink: #12212c; --muted: #5b6b78; --brand: #0b5c8a; --line: #dde7ee; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif; color: var(--ink);
    background: #f7fafc; padding: 24px;
  }
  main { max-width: 520px; text-align: center; }
  .code { font-size: 72px; font-weight: 800; color: var(--brand); line-height: 1; margin: 0 0 12px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: var(--brand); color: #fff; text-decoration: none; font-weight: 600;
  }
  a.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
  .note { margin-top: 28px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там тарифы, подключение и ответы на вопросы.</p>
  <a class="btn" href="/landing-study/">На главную</a>
  <p class="note">Учебный макет: не официальный сайт оператора, заявки никуда не отправляются.</p>
</main>
</body>
</html>
